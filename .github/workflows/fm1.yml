# Build the FM-1 firmware on GitHub: on every push to main, or by hand (Actions -> fm1 -> Run workflow).
# The .fwsc to install is attached to the run as the artifact "arcturus-s6-firmware".
# The build's last lines are also posted as annotations (errors on a failure, notices on success),
# so they can be read without opening the log.
name: fm1

on:
  push:
    branches: [arcturus]
  workflow_dispatch:

permissions:
  contents: write                  # the arcturus-firmware branch (last step)

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: JieLi toolchain (pkgman.jieliapp.com)
        run: sh tools/get_toolchain.sh

      - name: JieLi AC79 SDK
        run: |
          for i in 1 2 3; do                     # (gitee.com drops a clone now and then: try again)
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK

      - name: Build (FM-1)
        shell: bash
        run: |
          set +e
          sh build.sh > build.log 2>&1
          status=$?
          cat build.log
          if [ $status -ne 0 ]; then
            grep -iE "error|warning|exceeds|refer|>|fail" build.log | tail -25 | while IFS= read -r l; do echo "::error::$l"; done
            tail -15 build.log | while IFS= read -r l; do echo "::error::$l"; done
            exit $status
          fi
          tail -8 build.log | while IFS= read -r l; do echo "::notice::$l"; done

      - name: Host tests (the app on the runner)
        run: sh tests/run_host.sh && sh tests/run_host.sh tests/scripts/demo.txt

      - name: Package for Windows (the firmware, the installer and a double-click install.bat)
        run: |
          mkdir -p dist
          cp build/arcturus-s6.fwsc dist/arcturus-s6.fwsc
          cp tools/fm1_install.py tools/fm1_winmidi.py tools/windows/install.bat dist/

      - uses: actions/upload-artifact@v4
        with:
          name: arcturus-s6-firmware
          path: dist/
          if-no-files-found: error

      # the same files on the branch "arcturus-firmware": one click to download
      - name: The arcturus-firmware branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b arcturus-firmware
          git add .
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "arcturus-s6.fwsc from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" arcturus-firmware
